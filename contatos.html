<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcenaria S J Campos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="nav">
      <a href="index.html">Início</a>
      <a href="sobre.html">Sobre</a>
      <a href="contatos.html">Contatos</a>
    </nav>
  </header>


<main class="contato-container">
  
  <!-- Bloco do Formulário -->
  <section class="form-secao">
    <h2>Fale Conosco</h2>
    <form action="#" method="POST">
      <div class="campo">
        <label for="nome">Nome:</label>
      </div>

      <div class="campo">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="@email" required>
      </div>

      <div class="campo">
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="4" placeholder="Descreva o seu projeto/Apenas entre em contato" required></textarea>
      </div>

      <button type="submit" class="btn-enviar">Enviar Mensagem</button>
    </form>
  </section>

  <!-- Bloco de Informações -->
  <section class="info-secao">
    <h2>Nossos Contatos</h2>
    <p><strong>WhatsApp:</strong> (12) 99999-9999</p>
    <p><strong>E-mail:</strong> contato@marcenariasjc.com.br</p>
    <p><strong>Localização:</strong> São José dos Campos - SP</p>
    <p><strong>Atendimento:</strong> Seg. a Sex. das 8h às 18h</p>
  </section>

</main>
